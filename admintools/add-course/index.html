<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הוספת קורס – קורסילנד אדמין</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #9B30E8;
    --blue: #3B6FF0;
    --grad: linear-gradient(135deg, #9B30E8 0%, #5B52F0 50%, #3B6FF0 100%);
    --grad-soft: linear-gradient(135deg, rgba(155,48,232,0.10) 0%, rgba(59,111,240,0.10) 100%);
    --bg: #F7F6FD;
    --surface: #FFFFFF;
    --text: #1A1330;
    --muted: #7A6E99;
    --border: rgba(155,48,232,0.15);
    --border-focus: rgba(155,48,232,0.5);
    --shadow: 0 8px 32px rgba(91,82,240,0.12);
    --success: #16a34a;
    --error: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Heebo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    direction: rtl;
  }

  nav {
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    padding: 0 2rem;
  }
  .nav-inner {
    max-width: 860px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    height: 64px;
  }
  .logo-text {
    font-size: 1.2rem; font-weight: 800;
    background: var(--grad);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .nav-badge {
    font-size: 0.68rem; font-weight: 700;
    background: var(--grad); color: #fff;
    padding: 0.18rem 0.5rem; border-radius: 50px;
    margin-right: 0.5rem;
  }
  .back-link {
    color: var(--muted); text-decoration: none;
    font-size: 0.85rem; font-weight: 600;
    display: flex; align-items: center; gap: 0.3rem;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--purple); }

  .page {
    max-width: 860px; margin: 0 auto;
    padding: 2.5rem 1.5rem 5rem;
  }
  .page-header { margin-bottom: 1.5rem; }
  .page-header h1 {
    font-size: 1.9rem; font-weight: 900;
    background: var(--grad);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; letter-spacing: -0.5px;
    margin-bottom: 0.3rem;
  }
  .page-header p { font-size: 0.9rem; color: var(--muted); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 1.6rem 2rem;
    box-shadow: var(--shadow);
    margin-bottom: 1.25rem;
  }

  /* FORM */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.2rem 1.5rem;
  }
  .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
  .form-group.full { grid-column: 1 / -1; }

  label {
    font-size: 0.8rem; font-weight: 700;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px;
  }
  label .req { color: var(--purple); margin-right: 2px; }
  label .opt { color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 0.78rem; }

  input[type="text"],
  input[type="url"],
  input[type="number"],
  textarea,
  select {
    width: 100%;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 0.7rem 0.9rem;
    font-family: 'Heebo', sans-serif;
    font-size: 0.95rem;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    direction: rtl;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px rgba(155,48,232,0.1);
    background: #fff;
  }
  textarea { resize: vertical; min-height: 90px; }

  .field-hint { font-size: 0.76rem; color: var(--muted); line-height: 1.5; }

  .price-wrap { position: relative; }
  .price-prefix {
    position: absolute; right: 0.85rem; top: 50%;
    transform: translateY(-50%);
    font-size: 1rem; font-weight: 700; color: var(--purple);
    pointer-events: none;
  }

  .duration-wrap { display: flex; align-items: center; gap: 0.5rem; }
  .duration-wrap input { width: 110px; flex-shrink: 0; }
  .duration-suffix {
    font-size: 0.95rem; font-weight: 600; color: var(--muted); white-space: nowrap;
  }

  .img-input-row {
    display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap;
  }
  .img-input-row input[type="url"] { flex: 1; min-width: 180px; }
  .btn-upload-img {
    display: inline-flex; align-items: center; gap: 0.35rem;
    background: var(--grad-soft);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 0.68rem 1rem;
    font-family: 'Heebo', sans-serif;
    font-size: 0.85rem; font-weight: 700; color: var(--purple);
    cursor: pointer; white-space: nowrap;
    transition: background 0.2s, border-color 0.2s;
  }
  .btn-upload-img:hover { background: rgba(155,48,232,0.15); border-color: var(--border-focus); }
  #img-upload-status {
    font-size: 0.8rem; font-weight: 600; margin-top: 0.4rem;
    display: none;
  }
  .img-preview {
    width: 100%; max-width: 240px;
    height: 130px; object-fit: cover;
    border-radius: 10px; border: 1.5px solid var(--border);
    margin-top: 0.6rem; display: none; background: var(--bg);
  }
  #new-category-wrap { display: none; margin-top: 0.5rem; }

  .submit-row {
    margin-top: 2rem;
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
  }
  .btn-submit {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: var(--grad); color: #fff;
    border: none; cursor: pointer;
    font-family: 'Heebo', sans-serif;
    font-size: 1rem; font-weight: 700;
    padding: 0.85rem 2.2rem;
    border-radius: 50px;
    transition: opacity 0.2s, transform 0.15s;
    box-shadow: 0 4px 16px rgba(155,48,232,0.3);
  }
  .btn-submit:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn-submit:active { transform: translateY(0); }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-submit .spinner {
    width: 18px; height: 18px;
    border: 2.5px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #toast {
    display: none;
    position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
    z-index: 999;
    background: var(--success);
    color: #fff;
    padding: 1rem 2rem;
    border-radius: 50px;
    font-size: 0.95rem; font-weight: 700;
    box-shadow: 0 8px 30px rgba(22,163,74,0.35);
    animation: slideUp 0.3s ease;
    text-align: center;
    max-width: 90vw;
  }
  #toast.error { background: var(--error); box-shadow: 0 8px 30px rgba(220,38,38,0.35); }
  @keyframes slideUp { from { bottom: 0; opacity: 0; } to { bottom: 2rem; opacity: 1; } }

  .section-title {
    font-size: 0.73rem; font-weight: 700; color: var(--purple);
    text-transform: uppercase; letter-spacing: 1.5px;
    margin: 1.8rem 0 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
  }
  .section-title:first-child { margin-top: 0; }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full { grid-column: 1; }
    .page { padding: 1.5rem 1rem 4rem; }
    .card { padding: 1.4rem 1.2rem; }
    .token-row { flex-direction: column; align-items: stretch; }
    .btn-save-token { text-align: center; }
  }

  /* ── נגישות ── */
  .skip-link {
    position: absolute; top: -100%; right: 0;
    background: #9B30E8; color: #fff;
    padding: 0.75rem 1.5rem; font-weight: 700; font-size: 1rem;
    text-decoration: none; z-index: 9999; border-radius: 0 0 8px 0;
  }
  .skip-link:focus { top: 0; outline: 3px solid #fff; outline-offset: 2px; }
  :focus-visible { outline: 3px solid #9B30E8; outline-offset: 3px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<a href="#main-content" class="skip-link">דלג לתוכן המרכזי</a>

<nav>
  <div class="nav-inner">
    <div style="display:flex;align-items:center;">
      <span class="logo-text">קורסילנד</span>
      <span class="nav-badge">ADMIN</span>
    </div>
    <a href="../index.html" class="back-link">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      כלי אדמין
    </a>
  </div>
</nav>

<main id="main-content">
<div class="page">
  <div class="page-header">
    <h1>📚 הוספת קורס לקטלוג</h1>
    <p>מלא את הפרטים ולחץ "הוסף קורס" — הקורס יתווסף ל-GitHub ישירות</p>
  </div>

  <!-- FORM CARD -->
  <div class="card">
    <form id="course-form" novalidate>

      <div class="section-title" style="margin-top:0">פרטי הקורס</div>
      <div class="form-grid">

        <div class="form-group full">
          <label for="title">שם הקורס <span class="req">*</span></label>
          <input type="text" id="title" placeholder="למשל: מיינדסט עושר – 30 יום לשינוי" required>
        </div>

        <div class="form-group">
          <label for="instructor">שם המנחה <span class="req">*</span></label>
          <input type="text" id="instructor" placeholder="למשל: ד״ר רונית כהן" required>
        </div>

        <div class="form-group">
          <label for="category">קטגוריה <span class="req">*</span></label>
          <select id="category" required>
            <option value="">הזן טוקן תחילה...</option>
          </select>
          <div id="new-category-wrap">
            <input type="text" id="new-category" placeholder="שם קטגוריה חדשה...">
          </div>
        </div>

        <div class="form-group full">
          <label for="desc">תיאור הקורס <span class="req">*</span></label>
          <textarea id="desc" placeholder="תיאור קצר ומשכנע של הקורס..." required></textarea>
        </div>

      </div>

      <div class="section-title">מחיר ואורך</div>
      <div class="form-grid">

        <div class="form-group">
          <label for="price">מחיר <span class="req">*</span></label>
          <div class="price-wrap">
            <span class="price-prefix">₪</span>
            <input type="number" id="price" placeholder="297" min="0" required style="padding-right:2.4rem">
          </div>
        </div>

        <div class="form-group">
          <label for="old-price">מחיר לפני הנחה <span class="opt">(אופציונלי)</span></label>
          <div class="price-wrap">
            <span class="price-prefix">₪</span>
            <input type="number" id="old-price" placeholder="500" min="0" style="padding-right:2.4rem">
          </div>
          <div class="field-hint">אם ימולא, יוצג מחוק ליד המחיר הנוכחי — כך שייראה שהקורס בהנחה</div>
        </div>

        <div class="form-group">
          <label for="duration">מספר שיעורים <span class="req">*</span></label>
          <div class="duration-wrap">
            <input type="number" id="duration" placeholder="10" min="1" required>
            <span class="duration-suffix">שיעורים</span>
          </div>
        </div>

      </div>

      <div class="section-title">קישורים ומדיה</div>
      <div class="form-grid">

        <div class="form-group full">
          <label for="link">קישור לדף המכירה <span class="opt">(אופציונלי)</span></label>
          <input type="url" id="link" placeholder="https://...">
        </div>

        <div class="form-group full">
          <label for="img">תמונה <span class="opt">(URL או העלאה מהמחשב — ריק = ברירת מחדל)</span></label>
          <div class="img-input-row">
            <input type="url" id="img" placeholder="https://images.unsplash.com/...">
            <label class="btn-upload-img" for="img-file">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              העלה מהמחשב
            </label>
            <input type="file" id="img-file" accept="image/*" style="display:none">
          </div>
          <div id="img-upload-status"></div>
          <img id="img-preview" class="img-preview" alt="תצוגה מקדימה">
        </div>

      </div>

      <div class="submit-row">
        <button type="submit" class="btn-submit" id="submit-btn">
          <span class="spinner" id="spinner"></span>
          <span id="btn-text">הוסף קורס ⬆️</span>
        </button>
      </div>

    </form>
  </div>
</div>

</main>
<div id="toast"></div>

<script>
/* ── חיבור לשרת ── */
/* האימות והטוקן יושבים בצד השרת. הדף הזה לא מחזיק שום סוד. */
const API     = '/dashboard/api/github_write.php';
const SESSION = '/dashboard/api/admintools_session.php';
const FILE    = 'index.html';
const DEFAULT_IMG = 'https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=600&q=80';

let csrfToken = '';

async function requireSession() {
  let res;
  try {
    res = await fetch(SESSION, { credentials: 'same-origin' });
  } catch (e) {
    throw new Error('אין תקשורת עם השרת');
  }
  if (res.status === 401) { location.replace('/dashboard/login.php'); throw new Error('לא מחובר'); }
  if (!res.ok) throw new Error(`שגיאת שרת ${res.status}`);
  csrfToken = (await res.json()).csrf_token;
}

/* ── קריאה לפרוקסי ── */
async function api(fields) {
  const body = fields instanceof FormData ? fields : new FormData();
  if (!(fields instanceof FormData)) {
    Object.entries(fields).forEach(([k, v]) => body.append(k, v));
  }
  body.append('csrf_token', csrfToken);

  const res = await fetch(API, { method: 'POST', body, credentials: 'same-origin' });
  if (res.status === 401) { location.replace('/dashboard/login.php'); throw new Error('לא מחובר'); }

  // קוראים כטקסט ולא כ-JSON: כשהתשובה מגיעה משכבה שלפני ה-PHP היא לא JSON,
  // וזריקתה השאירה אותנו עם מספר סטטוס בלבד בלי שום רמז מה קרה
  const raw = await res.text();
  let data = {};
  try { data = JSON.parse(raw); } catch (e) {}

  if (!res.ok) {
    const peek = raw.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 200);
    throw new Error(data.error || `שגיאת שרת ${res.status} — ${peek || 'תשובה ריקה'}`);
  }
  return data;
}

/* ── העלאת תמונה דרך השרת ── */
async function uploadImage(file) {
  const fd = new FormData();
  fd.append('action', 'upload_image');
  fd.append('image', file);
  try {
    const { url } = await api(fd);
    return url;
  } catch (e) {
    // בלי זה לא ברור אם נפל שלב התמונה או הכתיבה של הקטלוג
    throw new Error('העלאת התמונה נכשלה — ' + e.message);
  }
}

/* ── Category dropdown ── */
async function loadCategories() {
  const sel = document.getElementById('category');
  sel.innerHTML = '<option value="">טוען קטגוריות...</option>';
  try {
    const { categories } = await api({ action: 'list_categories' });

    sel.innerHTML = '<option value="">בחר קטגוריה...</option>';
    categories.forEach(cat => {
      const o = document.createElement('option');
      o.value = o.textContent = cat;
      sel.appendChild(o);
    });
    const newOpt = document.createElement('option');
    newOpt.value = '__new__';
    newOpt.textContent = '➕ הוסף קטגוריה חדשה';
    sel.appendChild(newOpt);
  } catch (e) {
    sel.innerHTML = '<option value="">שגיאה בטעינה</option>';
    showToast('❌ ' + e.message, true);
  }
}

/* ── Category select ── */
document.getElementById('category').addEventListener('change', function () {
  const wrap = document.getElementById('new-category-wrap');
  wrap.style.display = this.value === '__new__' ? 'block' : 'none';
  if (this.value === '__new__') document.getElementById('new-category').focus();
});

/* ── Image preview (URL input) ── */
document.getElementById('img').addEventListener('input', function () {
  const preview = document.getElementById('img-preview');
  const url = this.value.trim();
  if (url) {
    preview.src = url;
    preview.style.display = 'block';
    preview.onerror = () => { preview.style.display = 'none'; };
  } else {
    preview.style.display = 'none';
  }
  // Clear file selection when URL is typed manually
  document.getElementById('img-file').value = '';
  document.getElementById('img-upload-status').style.display = 'none';
});

/* ── Image file picker ── */
let pendingImageFile = null;
document.getElementById('img-file').addEventListener('change', function () {
  const file = this.files[0];
  if (!file) return;
  pendingImageFile = file;
  // Clear URL field
  document.getElementById('img').value = '';
  // Show local preview
  const preview = document.getElementById('img-preview');
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
  preview.onerror = () => { preview.style.display = 'none'; };
  // Status hint
  const status = document.getElementById('img-upload-status');
  status.textContent = `נבחר: ${file.name} — התמונה תועלה ל-GitHub בעת שמירת הקורס`;
  status.style.display = 'block';
  status.style.color = 'var(--muted)';
});

/* ── Toast ── */
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = isError ? 'error' : '';
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.display = 'none'; }, 5000);
}

function setLoading(on) {
  const btn = document.getElementById('submit-btn');
  document.getElementById('spinner').style.display = on ? 'block' : 'none';
  document.getElementById('btn-text').textContent = on ? 'מעלה ל-GitHub...' : 'הוסף קורס ⬆️';
  btn.disabled = on;
}

/* ── Form submit ── */
document.getElementById('course-form').addEventListener('submit', async function (e) {
  e.preventDefault();

  const title    = document.getElementById('title').value.trim();
  const instructor = document.getElementById('instructor').value.trim();
  const desc     = document.getElementById('desc').value.trim();
  const priceNum = document.getElementById('price').value.trim();
  const oldPriceNum = document.getElementById('old-price').value.trim();
  const durationNum = document.getElementById('duration').value.trim();
  const duration = durationNum ? `${durationNum} שיעורים` : '';
  const link     = document.getElementById('link').value.trim();
  const imgVal   = document.getElementById('img').value.trim();

  const catSel = document.getElementById('category');
  let category = catSel.value;
  if (category === '__new__') category = document.getElementById('new-category').value.trim();

  if (!title || !instructor || !desc || !priceNum || !duration || !category) {
    showToast('⚠️ יש למלא את כל השדות הנדרשים', true);
    return;
  }
  if (oldPriceNum && Number(oldPriceNum) <= Number(priceNum)) {
    showToast('⚠️ המחיר לפני ההנחה חייב להיות גבוה מהמחיר הנוכחי', true);
    return;
  }

  setLoading(true);
  try {
    // 1. Upload image file to GitHub if one was selected
    let resolvedImg = imgVal || DEFAULT_IMG;
    if (pendingImageFile) {
      document.getElementById('img-upload-status').textContent = 'מעלה תמונה ל-GitHub...';
      document.getElementById('img-upload-status').style.display = 'block';
      resolvedImg = await uploadImage(pendingImageFile);
    }

    // 2. השרת קורא את הקטלוג, משבץ את הקורס וכותב בחזרה.
    //    הקטלוג לא עובר כאן — נשלחים רק פרטי הקורס.
    await api({
      action: 'add_course',
      title, desc, category, duration, instructor,
      price: '₪' + priceNum,
      oldPrice: oldPriceNum ? '₪' + oldPriceNum : '',
      img: resolvedImg,
      link
    });

    showToast('הקורס נוסף בהצלחה. האתר יתעדכן תוך מספר שניות.');
    this.reset();
    pendingImageFile = null;
    document.getElementById('img-preview').style.display = 'none';
    document.getElementById('img-upload-status').style.display = 'none';
    document.getElementById('new-category-wrap').style.display = 'none';
    loadCategories();
  } catch (err) {
    showToast('❌ שגיאה: ' + err.message, true);
  } finally {
    setLoading(false);
  }
});

/* ── Init ── */
(async function init() {
  try {
    await requireSession();   // מפנה ל-login.php אם אין session
    loadCategories();
  } catch (e) {
    showToast('❌ ' + e.message, true);
  }
})();
</script>
