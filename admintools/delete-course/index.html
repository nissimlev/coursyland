<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מחיקת קורס – קורסילנד אדמין</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #9B30E8;
    --blue: #3B6FF0;
    --grad: linear-gradient(135deg, #9B30E8 0%, #5B52F0 50%, #3B6FF0 100%);
    --grad-soft: linear-gradient(135deg, rgba(155,48,232,0.10) 0%, rgba(59,111,240,0.10) 100%);
    --bg: #F7F6FD;
    --surface: #FFFFFF;
    --text: #1A1330;
    --muted: #7A6E99;
    --border: rgba(155,48,232,0.15);
    --border-focus: rgba(155,48,232,0.5);
    --shadow: 0 8px 32px rgba(91,82,240,0.12);
    --success: #16a34a;
    --error: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Heebo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    direction: rtl;
  }

  nav {
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    padding: 0 2rem;
  }
  .nav-inner {
    max-width: 860px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    height: 64px;
  }
  .logo-text {
    font-size: 1.2rem; font-weight: 800;
    background: var(--grad);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .nav-badge {
    font-size: 0.68rem; font-weight: 700;
    background: var(--grad); color: #fff;
    padding: 0.18rem 0.5rem; border-radius: 50px;
    margin-right: 0.5rem;
  }
  .back-link {
    color: var(--muted); text-decoration: none;
    font-size: 0.85rem; font-weight: 600;
    display: flex; align-items: center; gap: 0.3rem;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--purple); }

  .page {
    max-width: 860px; margin: 0 auto;
    padding: 2.5rem 1.5rem 5rem;
  }
  .page-header { margin-bottom: 1.5rem; }
  .page-header h1 {
    font-size: 1.9rem; font-weight: 900;
    background: var(--grad);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; letter-spacing: -0.5px;
    margin-bottom: 0.3rem;
  }
  .page-header p { font-size: 0.9rem; color: var(--muted); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 1.6rem 2rem;
    box-shadow: var(--shadow);
    margin-bottom: 1.25rem;
  }

  /* SECTION TITLE */
  .section-title {
    font-size: 0.73rem; font-weight: 700; color: var(--purple);
    text-transform: uppercase; letter-spacing: 1.5px;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
  }

  /* COURSE LIST */
  #courses-list { display: flex; flex-direction: column; gap: 0; }

  .course-row {
    display: flex; align-items: center; gap: 1rem;
    padding: 0.9rem 0;
    border-bottom: 1px solid var(--border);
  }
  .course-row:last-child { border-bottom: none; padding-bottom: 0; }
  .course-row:first-child { padding-top: 0; }

  .course-thumb {
    width: 56px; height: 56px; border-radius: 10px;
    object-fit: cover; flex-shrink: 0;
    border: 1.5px solid var(--border);
    background: var(--bg);
  }
  .course-info { flex: 1; min-width: 0; }
  .course-name {
    font-size: 0.97rem; font-weight: 700; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .course-meta {
    font-size: 0.8rem; color: var(--muted); margin-top: 0.15rem;
    display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap;
  }
  .course-price { font-weight: 700; color: var(--purple); }

  .btn-delete {
    background: #fff0f0; color: var(--error);
    border: 1.5px solid rgba(220,38,38,0.25);
    border-radius: 8px; cursor: pointer;
    font-family: 'Heebo', sans-serif;
    font-size: 0.82rem; font-weight: 700;
    padding: 0.45rem 0.9rem;
    display: flex; align-items: center; gap: 0.3rem;
    transition: background 0.18s, border-color 0.18s, transform 0.15s;
    white-space: nowrap; flex-shrink: 0;
  }
  .btn-delete:hover {
    background: #fee2e2; border-color: rgba(220,38,38,0.55);
    transform: translateY(-1px);
  }

  /* EMPTY / LOADING */
  .list-state {
    text-align: center; padding: 2.5rem 1rem;
    color: var(--muted); font-size: 0.95rem;
  }
  .list-state .spinner-lg {
    width: 36px; height: 36px; margin: 0 auto 1rem;
    border: 3px solid rgba(155,48,232,0.2);
    border-top-color: var(--purple);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* MODAL */
  #modal-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 200;
    background: rgba(26,19,48,0.55);
    backdrop-filter: blur(4px);
    align-items: center; justify-content: center;
  }
  #modal-overlay.open { display: flex; }

  #modal {
    background: var(--surface);
    border-radius: 20px;
    padding: 2rem 2.2rem;
    max-width: 420px; width: 90%;
    box-shadow: 0 24px 60px rgba(26,19,48,0.25);
    animation: popIn 0.22s ease;
  }
  @keyframes popIn { from { transform: scale(0.93); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .modal-icon {
    width: 52px; height: 52px;
    background: #fee2e2; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; margin-bottom: 1.1rem;
  }
  .modal-title {
    font-size: 1.15rem; font-weight: 800; color: var(--text);
    margin-bottom: 0.5rem;
  }
  .modal-body {
    font-size: 0.9rem; color: var(--muted); line-height: 1.6;
    margin-bottom: 1.6rem;
  }
  .modal-course-name {
    font-weight: 700; color: var(--text);
  }
  .modal-btns { display: flex; gap: 0.75rem; justify-content: flex-end; }
  .btn-cancel {
    background: var(--bg); color: var(--muted);
    border: 1.5px solid var(--border);
    border-radius: 50px; cursor: pointer;
    font-family: 'Heebo', sans-serif;
    font-size: 0.9rem; font-weight: 700;
    padding: 0.65rem 1.4rem;
    transition: border-color 0.18s, color 0.18s;
  }
  .btn-cancel:hover { border-color: var(--border-focus); color: var(--text); }
  .btn-confirm-delete {
    background: var(--error); color: #fff;
    border: none; border-radius: 50px; cursor: pointer;
    font-family: 'Heebo', sans-serif;
    font-size: 0.9rem; font-weight: 700;
    padding: 0.65rem 1.4rem;
    display: flex; align-items: center; gap: 0.4rem;
    box-shadow: 0 4px 14px rgba(220,38,38,0.35);
    transition: opacity 0.18s, transform 0.15s;
  }
  .btn-confirm-delete:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn-confirm-delete:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
  .btn-confirm-delete .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }

  /* TOAST */
  #toast {
    display: none;
    position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
    z-index: 999;
    background: var(--success); color: #fff;
    padding: 1rem 2rem; border-radius: 50px;
    font-size: 0.95rem; font-weight: 700;
    box-shadow: 0 8px 30px rgba(22,163,74,0.35);
    animation: slideUp 0.3s ease;
    text-align: center; max-width: 90vw;
  }
  #toast.error { background: var(--error); box-shadow: 0 8px 30px rgba(220,38,38,0.35); }
  @keyframes slideUp { from { bottom: 0; opacity: 0; } to { bottom: 2rem; opacity: 1; } }

  @media (max-width: 600px) {
    .page { padding: 1.5rem 1rem 4rem; }
    .card { padding: 1.4rem 1.2rem; }
    .token-row { flex-direction: column; align-items: stretch; }
    .btn-save-token { text-align: center; }
    .course-name { white-space: normal; }
    .modal-btns { flex-direction: column-reverse; }
    .btn-cancel, .btn-confirm-delete { text-align: center; justify-content: center; }
  }

  /* ── נגישות ── */
  .skip-link {
    position: absolute; top: -100%; right: 0;
    background: #9B30E8; color: #fff;
    padding: 0.75rem 1.5rem; font-weight: 700; font-size: 1rem;
    text-decoration: none; z-index: 9999; border-radius: 0 0 8px 0;
  }
  .skip-link:focus { top: 0; outline: 3px solid #fff; outline-offset: 2px; }
  :focus-visible { outline: 3px solid #9B30E8; outline-offset: 3px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<a href="#main-content" class="skip-link">דלג לתוכן המרכזי</a>

<nav>
  <div class="nav-inner">
    <div style="display:flex;align-items:center;">
      <span class="logo-text">קורסילנד</span>
      <span class="nav-badge">ADMIN</span>
    </div>
    <a href="../index.html" class="back-link">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      כלי אדמין
    </a>
  </div>
</nav>

<main id="main-content">
<div class="page">
  <div class="page-header">
    <h1>🗑️ מחיקת קורס מהקטלוג</h1>
    <p>בחר קורס ולחץ "מחק" להסרתו מפורטל הקורסים</p>
  </div>

  <!-- COURSE LIST CARD -->
  <div class="card">
    <div class="section-title">קורסים בקטלוג</div>
    <div id="courses-list">
      <div class="list-state">הזן טוקן GitHub כדי לטעון את הקורסים</div>
    </div>
  </div>
</div>

<!-- CONFIRM MODAL -->
<div id="modal-overlay">
  <div id="modal">
    <div class="modal-icon">🗑️</div>
    <div class="modal-title">מחיקת קורס</div>
    <div class="modal-body">
      האם אתה בטוח שברצונך למחוק את הקורס<br>
      <span class="modal-course-name" id="modal-course-name"></span>?<br>
      <span style="font-size:0.82rem;margin-top:0.4rem;display:block;">פעולה זו אינה ניתנת לביטול.</span>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" id="modal-cancel">ביטול</button>
      <button class="btn-confirm-delete" id="modal-confirm" aria-label="אשר מחיקת קורס">
        <span class="spinner" id="modal-spinner"></span>
        <span id="modal-btn-text">מחק קורס</span>
      </button>
    </div>
  </div>
</div>

</main>
<div id="toast"></div>

<script>
/* ── חיבור לשרת ── */
/* האימות והטוקן יושבים בצד השרת. הדף הזה לא מחזיק שום סוד. */
const API     = '/dashboard/api/github_write.php';
const SESSION = '/dashboard/api/admintools_session.php';
const FILE    = 'index.html';

let csrfToken = '';

async function requireSession() {
  let res;
  try {
    res = await fetch(SESSION, { credentials: 'same-origin' });
  } catch (e) {
    throw new Error('אין תקשורת עם השרת');
  }
  if (res.status === 401) { location.replace('/dashboard/login.php'); throw new Error('לא מחובר'); }
  if (!res.ok) throw new Error(`שגיאת שרת ${res.status}`);
  csrfToken = (await res.json()).csrf_token;
}

/* ── קריאה לפרוקסי ── */
async function api(fields) {
  const body = new FormData();
  Object.entries(fields).forEach(([k, v]) => body.append(k, v));
  body.append('csrf_token', csrfToken);

  const res = await fetch(API, { method: 'POST', body, credentials: 'same-origin' });
  if (res.status === 401) { location.replace('/dashboard/login.php'); throw new Error('לא מחובר'); }

  // קוראים כטקסט ולא כ-JSON: כשהתשובה מגיעה משכבה שלפני ה-PHP היא לא JSON,
  // וזריקתה השאירה אותנו עם מספר סטטוס בלבד בלי שום רמז מה קרה
  const raw = await res.text();
  let data = {};
  try { data = JSON.parse(raw); } catch (e) {}

  if (!res.ok) {
    const peek = raw.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 200);
    throw new Error(data.error || `שגיאת שרת ${res.status} — ${peek || 'תשובה ריקה'}`);
  }
  return data;
}

/* ── Toast ── */
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = isError ? 'error' : '';
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.display = 'none'; }, 5000);
}

/* ── Render course list ── */
function renderList(courses) {
  const container = document.getElementById('courses-list');
  if (!courses.length) {
    container.innerHTML = '<div class="list-state">אין קורסים בקטלוג</div>';
    return;
  }
  container.innerHTML = courses.map(c => `
    <div class="course-row" data-id="${c.id}">
      <img class="course-thumb" src="${escHtml(c.img || '')}" alt="" onerror="this.style.opacity='0'">
      <div class="course-info">
        <div class="course-name">${escHtml(c.title)}</div>
        <div class="course-meta">
          <span class="course-price">${escHtml(c.price)}</span>
          <span>${escHtml(c.instructor)}</span>
          ${c.category ? `<span>${escHtml(c.category)}</span>` : ''}
        </div>
      </div>
      <button class="btn-delete" data-id="${c.id}" data-title="${escAttr(c.title)}">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        מחק
      </button>
    </div>
  `).join('');

  container.querySelectorAll('.btn-delete').forEach(btn => {
    btn.addEventListener('click', () => openModal(Number(btn.dataset.id), btn.dataset.title));
  });
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s).replace(/"/g,'&quot;'); }

/* ── Load courses ── */
async function loadCourses() {
  const container = document.getElementById('courses-list');
  container.innerHTML = '<div class="list-state"><div class="spinner-lg"></div>טוען קורסים מ-GitHub...</div>';
  try {
    const { courses } = await api({ action: 'list_courses' });
    renderList(courses);
  } catch (e) {
    container.innerHTML = `<div class="list-state" style="color:var(--error)">❌ ${escHtml(e.message)}</div>`;
    showToast('❌ ' + e.message, true);
  }
}

/* ── Modal ── */
let pendingDeleteId = null;

function openModal(courseId, courseTitle) {
  pendingDeleteId = courseId;
  document.getElementById('modal-course-name').textContent = `"${courseTitle}"`;
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('modal-cancel').focus();
}

function closeModal() {
  pendingDeleteId = null;
  document.getElementById('modal-overlay').classList.remove('open');
  setModalLoading(false);
}

function setModalLoading(on) {
  document.getElementById('modal-spinner').style.display = on ? 'block' : 'none';
  document.getElementById('modal-btn-text').textContent = on ? 'מוחק...' : 'מחק קורס';
  document.getElementById('modal-confirm').disabled = on;
  document.getElementById('modal-cancel').disabled = on;
}

document.getElementById('modal-cancel').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', function (e) {
  if (e.target === this) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

document.getElementById('modal-confirm').addEventListener('click', async () => {
  if (pendingDeleteId === null) return;

  setModalLoading(true);
  try {
    // השרת מאתר את הרשומה, חותך אותה וכותב בחזרה. הקטלוג לא עובר כאן.
    await api({ action: 'delete_course', id: pendingDeleteId });
    closeModal();
    showToast('✅ הקורס נמחק בהצלחה. האתר יתעדכן תוך מספר שניות.');
    loadCourses();
  } catch (err) {
    showToast('❌ שגיאה: ' + err.message, true);
    setModalLoading(false);
  }
});

/* ── Init ── */
(async function init() {
  try {
    await requireSession();   // מפנה ל-login.php אם אין session
    loadCourses();
  } catch (e) {
    showToast('❌ ' + e.message, true);
  }
})();
</script>
</body>
</html>
