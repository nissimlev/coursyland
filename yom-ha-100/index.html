קרא ויחידות מידה (אחוזים? אלפים? דקות?). רוב הטעויות קורות כאן.",'אחוזים מול מספרים: "הגידול הגדול ביותר" ו"שיעור הגידול הגבוה ביותר" הן שתי שאלות שונות. אחוז גידול = (חדש − ישן) ÷ ישן.',"כשיש כמה מקורות, פתרו בשלבים: מה צריך ממקור 1, מה ממקור 2, ואיך מחברים ביניהם.","ממוצע של אחוזים מקבוצות בגדלים שונים הוא כמעט תמיד מלכודת. חשבו קודם מספרים מוחלטים.",'בשאלות "איזו טענה נכונה" בדקו כל טענה בנפרד. מספיקה דוגמה אחת שסותרת טענה כדי לפסול אותה.',"בלוחות זמנים: ההסעה שיוצאת ראשונה לא תמיד מגיעה ראשונה. חשבו יציאה + משך.","אם התשובה שלכם לא מופיעה בין האפשרויות, חפשו טעות בקריאת הנתון ולא בחישוב. אפשרויות קרובות הן לרוב מלכודות מכוונות.","הערכה מהירה: לפעמים מספיק לעגל ולהשוות כדי לפסול שתיים-שלוש תשובות בלי חישוב מלא."],Q2={prompt:"באיזה מחסן נשאר הכי הרבה מקום פנוי?",visuals:[{type:"table",title:"תפוסת מחסנים",rowHeader:"מחסן",columns:["קיבולת (משטחים)","תפוס (%)"],rows:[{label:"מחסן 1",values:[400,75]},{label:"מחסן 2",values:[250,40]},{label:"מחסן 3",values:[600,85]}]}],steps:["מה מחפשים? מקום פנוי במספר משטחים, ולא באחוזים.","פנוי = קיבולת × (100% − תפוס).","מחסן 1: 400 × 25% = 100. מחסן 2: 250 × 60% = 150. מחסן 3: 600 × 15% = 90.","המלכודת: מחסן 2 הוא הכי פחות תפוס באחוזים, אבל צריך לבדוק במספרים. במקרה הזה הוא באמת מנצח: 150 משטחים."],answer:"מחסן 2 (150 משטחים פנויים)"},G2={topic:W2,title:H2,intro:V2,tips:q2,example:Q2},K2="spatial",Y2="שיטת פתרון: תפיסה מרחבית",X2="השאלות בודקות אם אתם מצליחים להחזיק בראש צורה או כיוון ולשנות אותם בדמיון. הטריק הוא לא לנסות לדמיין הכול בבת אחת, אלא לעקוב אחרי פרט אחד בכל פעם.",J2=["ניווט: עקבו אחרי הכיוון שאליו אתם פונים אחרי כל הוראה. 'ימינה' של מי שפונה דרומה הוא מערבה במפה.","אפשר לסובב את הדף בדמיון (או להטות את הראש) כך שתמיד 'פונים למעלה'. אז ימין הוא באמת ימין.","סיבוב צורות: בחרו משבצת בולטת אחת, קצה או פינה, ובדקו לאן היא עוברת. בסיבוב עם כיוון השעון: למעלה ← ימין ← למטה ← שמאל.","תמונת מראה ≠ סיבוב. אם צורה 'מתהפכת' (הבליטה עוברת לצד השני), שום סיבוב לא יחזיר אותה למקור.","קיפול קובייה: שני ריבועים בשורה או בעמודה של הפריסה, עם ריבוע אחד ביניהם, יהיו זה מול זה. פאות נגדיות לעולם לא נראות יחד.","מבט מצד: בכל עמודה רואים רק את המגדל הגבוה ביותר. כשמסתכלים מימין, החזית נמצאת משמאלכם.","גלגלי שיניים: צמודים = כיוונים הפוכים. בשרשרת סופרים זוגי/אי-זוגי. מעגל סגור של מספר אי-זוגי של גלגלים = המערכת ננעלת.","פניות במעלות: ימינה = פלוס, שמאלה = מינוס. מחברים הכול ומחלקים ל-45° (צעד בשושנת הרוחות)."],Z2={prompt:"עומדים בצומת ופונים צפונה. פונים ימינה, הולכים, פונים ימינה שוב, ואז שמאלה. לאן פונים בסוף?",steps:["מתחילים בצפון.","ימינה מצפון → מזרח.","ימינה ממזרח → דרום.","שמאלה מדרום → מזרח (מי שפונה דרומה, השמאל שלו הוא מזרח).","בדיקה מהירה: ימינה + ימינה + שמאלה = ימינה אחת בסך הכול, כלומר 90° מצפון = מזרח."],answer:"מזרח"},eb={topic:K2,title:Y2,intro:X2,tips:J2,example:Z2},tb="technical",nb="שיטת פתרון: הפעלה טכנית",rb="לא צריך ידע טכני מוקדם. כל החוקים כתובים לפניכם. המבחן בודק כמה מהר לומדים מערכת חדשה ומפעילים אותה בדיוק לפי החוקים. אפשר גם לשחק עם הסימולטור לפני התרגול.",sb=["קראו את כל החוקים לפני השאלה הראשונה, וסמנו לעצמכם שלושה סוגים: תנאים ('רק כש...'), תוצאות ('מעלה ב-1') ותגובות אוטומטיות ('נכבה מעצמו').","בשאלות 'מה יקרה', עקבו פעולה אחר פעולה וכתבו (בראש או על דף) את המצב אחרי כל אחת. רוב הטעויות קורות כשמדלגים על שלב.","אחרי כל פעולה בדקו את החוקים האוטומטיים: מגבלות מקסימום, כיבוי עצמי, נורות שמתעדכנות.","'מה מותר עכשיו': בדקו כל אפשרות מול המצב הנוכחי, לא מול מצב ההתחלה.","'מינימום פעולות': חשבו מהסוף להתחלה. מה חייב להיות נכון רגע לפני המטרה? מה חוסם את זה?","חפשו פעולות 'מסוכנות' שמשנות כמה דברים בבת אחת (איפוס, כיבוי ראשי), ותבדקו מה עוד הן משנות.","בסימולציה אינטראקטיבית אפשר להתחיל מחדש. עדיף לעצור ולתכנן לפני שלוחצים."],ib={prompt:"מערכת: נורה ירוקה דולקת כשבדיוק אחד ממתגים 2 ו-3 מופעל. מתג 2 מופעל, מתג 3 כבוי. מפעילים את מתג 3. מה מצב הנורה?",steps:["לפני: מתג 2 מופעל, מתג 3 כבוי → בדיוק אחד מופעל → ירוקה דולקת.","פעולה: מתג 3 עובר למופעל.","אחרי: שני המתגים מופעלים → זה לא 'בדיוק אחד' → הנורה נכבית.","המלכודת: לקרוא את החוק כ'לפחות אחד' במקום 'בדיוק אחד'."],answer:"הנורה הירוקה כבויה"},lb={topic:tb,title:nb,intro:rb,tips:sb,example:ib},ab="management",ob="שיטת פתרון: ניהול וארגון",cb="השאלות מדמות עבודה של רכז/ת או מפקד/ת: לסדר משימות, לשבץ אנשים ולזהות בעיות בלוח הזמנים. בכל השאלות יש כללים ברורים, והמטרה היא להפעיל אותם בעקביות ובלי לפספס אילוץ.",ub=["סדר עדיפויות: הפעילו את הכללים לפי הסדר. הכלל השני משמש רק לשבור שוויון בכלל הראשון.","אם משימה תלויה במשימה אחרת, היא 'לא זמינה' עד שהאחרת מסתיימת, גם אם היא דחופה.","שיבוץ: התחילו ממי שיש לו הכי מעט אפשרויות, או מהתפקיד שהכי מעט אנשים מתאימים לו. כל שיבוץ מצמצם את האפשרויות של האחרים.","אחרי כל שיבוץ עברו שוב על האילוצים ('לא יכול', 'חייב', 'לא סמוכים').","התנגשות היא חפיפה בזמן וגם אדם או חדר משותפים. פגישה שמסתיימת ב-10:00 לא מתנגשת עם פגישה שמתחילה ב-10:00.","מספר החדרים המינימלי הוא המספר הגדול ביותר של פגישות שמתקיימות באותו רגע.","לוח זמנים של פרויקט: משימה מתחילה כשכל המשימות שהיא תלויה בהן הסתיימו. זמן הסיום של הפרויקט נקבע לפי השרשרת הארוכה ביותר, ולא לפי סכום כל המשימות.","משימה 'קריטית' נמצאת על השרשרת הארוכה ביותר. כל עיכוב בה מעכב את הכול."],db={prompt:"שלוש משימות: א (2 שעות), ב (3 שעות), ג (1 שעה) שאפשר להתחיל רק אחרי א ו-ב. מתי יסתיים הכול?",steps:["א ו-ב לא תלויות זו בזו, ולכן מתחילות יחד בזמן 0.","א מסתיימת ב-2, ב מסתיימת ב-3.","ג מחכה לשתיהן, ולכן מתחילה ב-3 (המאוחרת מביניהן) ומסתיימת ב-4.","המלכודת: לחבר 2 + 3 + 1 = 6, כאילו אין עבודה במקביל."],answer:"אחרי 4 שעות"},fb={topic:ab,title:ob,intro:cb,tips:ub,example:db},pb="attention",mb="שיטת פתרון: קשב מתמשך",hb="המשחקים בודקים כמה זמן אתם שומרים על ריכוז, ולא רק אם אתם יודעים את התשובה. מודדים גם דיוק וגם מהירות, ובמיוחד אם הביצוע נשאר יציב עד הסוף.",gb=["Go/No-Go: הקצב יוצר הרגל ללחוץ. המטרה היא לעצור בדיוק כשמופיע הגירוי האסור. עדיף להיות קצת יותר איטיים ומדויקים.","שבו בנוחות, אצבע מעל מקש הרווח, ועיניים במרכז המסך. אל תסתכלו על המקלדת.","חיפוש ברשת: סרקו בשיטה, שורה אחר שורה, ולא בקפיצות. חפשו את התכונה שמבדילה את המטרה (צבע, כיוון) ולא את כל הצורה.","זיהוי שינוי: נסו לקלוט את התמונה כולה, ולא לשנן פריט אחד. שימו לב לצבעים ולמיקומים.","אם טעיתם, אל תתעכבו על זה. הטעות הבאה קורית בדרך כלל כשעדיין חושבים על הקודמת.","בחצי השני של המשחק הקשב נוטה לרדת. זה בדיוק מה שנמדד, אז זה הזמן להתרכז מחדש.","תרגלו בשעה שבה המבחן יתקיים, ובסביבה שקטה בלי טלפון ליד."],xb={prompt:"במשחק Go/No-Go: לוחצים על כל עיגול ירוק, ולא לוחצים על ריבוע אדום. מופיעים: ירוק, ירוק, ירוק, אדום.",steps:["שלושת העיגולים הירוקים: לוחצים מהר.","אחרי שלוש לחיצות היד 'מוכנה' ללחוץ שוב. כאן נמדדת העצירה.","על הריבוע האדום לא לוחצים. לחיצה עליו נספרת כאזעקת שווא (False Alarm)."],answer:"3 לחיצות, ועצירה על האדום"},vb={topic:pb,title:mb,intro:hb,tips:gb,example:xb},yb=[G2,eb,lb,fb,vb],I0=e=>yb.find(t=>t.topic===e)??null,sr=e=>`var(--series-${e%8+1})`,Vt=e=>e.toLocaleString("en-US",{maximumFractionDigits:2});function _0(e){const t=10**Math.floor(Math.log10(Math.max(1,e)));for(const n of[1,1.2,1.5,2,2.5,3,4,5,6,8,10])if(n*t>=e)return n*t;return 10*t}function O0({names:e}){return e.length<2?null:a.jsx("ul",{className:"mb-2 flex flex-wrap gap-x-4 gap-y-1 text-sm muted","aria-label":"מקרא",children:e.map((t,n)=>a.jsxs("li",{className:"flex items-center gap-1.5",children:[a.jsx("span",{"aria-hidden":!0,className:"inline-block h-3 w-3 rounded-sm",style:{background:sr(n)}}),t]},t))})}function bb({spec:e}){const o=_0(Math.max(...e.series.flatMap(b=>b.values))),c=5,u=584/e.categories.length,d=e.series.length,f=2,p=Math.min(46,(u*.72-f*(d-1))/d),x=b=>22+234*(1-b/o);return a.jsxs("figure",{children:[a.jsx(O0,{names:e.series.map(b=>b.name)}),a.jsxs("svg",{viewBox:"0 0 640 300",className:"h-auto w-full",role:"img","aria-label":e.title??"גרף עמודות",direction:"ltr",children:[[...Array(c+1)].map((b,g)=>{const h=o/c*g;return a.jsxs("g",{children:[a.jsx("line",{x1:44,x2:628,y1:x(h),y2:x(h),stroke:"var(--grid)",strokeWidth:1}),a.jsx("text",{x:38,y:x(h)+4,textAnchor:"end",fontSize:11,fill:"var(--ink-3)",children:Vt(h)})]},g)}),e.categories.map((b,g)=>{const h=44+u*g+(u-(p*d+f*(d-1)))/2;return a.jsxs("g",{children:[e.series.
